name: Build ruijie-auth APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'package/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip python3 file rsync zstd

      - name: Discover ImmortalWrt SDK (25.12.1, mediatek/filogic)
        run: |
          set -eu
          BASES="https://downloads.immortalwrt.org/releases/25.12.1/targets/mediatek/filogic https://mirrors.tuna.tsinghua.edu.cn/immortalwrt/releases/25.12.1/targets/mediatek/filogic https://mirror.nju.edu.cn/immortalwrt/releases/25.12.1/targets/mediatek/filogic https://mirrors.aliyun.com/immortalwrt/releases/25.12.1/targets/mediatek/filogic"
          SDK_NAME=""
          SDK_BASE=""
          for BASE in $BASES; do
            echo "== trying $BASE =="
            if wget -T 60 -t 2 -O listing.html "$BASE/" 2>listing.err; then
              echo "-- listing fetched, sdk hrefs:"
              grep -oE 'href="[^"]*immortalwrt-sdk[^"]*"' listing.html | head -n 5 || true
              SDK_NAME=$(grep -oE 'href="[^"]*immortalwrt-sdk-[^"]*\.tar\.(xz|zst)"' listing.html | head -n1 | sed -e 's/^href="//' -e 's/"$//')
            else
              echo "-- wget failed:"
              tail -n 5 listing.err || true
            fi
            if [ -n "$SDK_NAME" ]; then SDK_BASE="$BASE"; break; fi
          done
          if [ -z "$SDK_NAME" ]; then
            echo "::error::no SDK tarball found on any mirror"
            exit 1
          fi
          echo "SDK_NAME=$SDK_NAME"
          echo "SDK_BASE=$SDK_BASE"
          wget -T 300 -O sdk.tar.zst "$SDK_BASE/$SDK_NAME"
          tar xf sdk.tar.zst
          mv immortalwrt-sdk-* sdk
          echo "SDK unpacked: $(ls -d sdk)"

      - name: Update and install feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy package sources into SDK
        working-directory: sdk
        run: |
          mkdir -p package
          cp -r "$GITHUB_WORKSPACE/package/ruijie-auth" package/
          cp -r "$GITHUB_WORKSPACE/package/luci-app-ruijie-auth" package/

      - name: Generate SDK default config (defconfig)
        working-directory: sdk
        run: make defconfig

      - name: Compile ruijie-auth
        working-directory: sdk
        run: make package/ruijie-auth/compile V=s

      - name: Compile luci-app-ruijie-auth
        working-directory: sdk
        run: make package/luci-app-ruijie-auth/compile V=s

      - name: Locate artifacts
        run: |
          echo "=== produced packages ==="
          find sdk/bin/packages -name 'ruijie-auth*' -o -name 'luci-app-ruijie-auth*' | sort
          find sdk/bin/packages -name 'ruijie-auth*.apk' -o -name 'luci-app-ruijie-auth*.apk' -o -name 'ruijie-auth*.ipk' -o -name 'luci-app-ruijie-auth*.ipk' | xargs -r sha256sum

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ruijie-auth-packages
          path: |
            sdk/bin/packages/aarch64_cortex-a53/base/ruijie-auth_*.apk
            sdk/bin/packages/aarch64_cortex-a53/base/ruijie-auth_*.ipk
            sdk/bin/packages/aarch64_cortex-a53/luci/luci-app-ruijie-auth_*.apk
            sdk/bin/packages/aarch64_cortex-a53/luci/luci-app-ruijie-auth_*.ipk
          if-no-files-found: error
